[project]
name = "laboratorio-cg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramon Camilo Figueiredo", email = "ramon.figueiredo@edu.unifil.br" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
